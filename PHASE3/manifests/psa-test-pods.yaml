# Test pods for PSA validation
# These pods demonstrate allowed and disallowed configurations

---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-pod
  namespace: staging
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
  containers:
  - name: nginx
    image: nginx:1.25
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      limits:
        cpu: "1"
        memory: "512Mi"
      requests:
        cpu: "0.5"
        memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: disallowed-pod
  namespace: staging
spec:
  # This pod will be rejected when enforce: restricted is enabled
  securityContext:
    runAsUser: 0  # Running as root - not allowed
  containers:
  - name: privileged-nginx
    image: nginx:1.25
    securityContext:
      privileged: true  # Privileged mode - not allowed
      allowPrivilegeEscalation: true  # Not allowed
    
# Test Instructions:
# 1. Apply namespace labels first:
#    kubectl apply -f psa-labels.yaml
#
# 2. Try creating the allowed pod:
#    kubectl apply -f psa-test-pods.yaml -l pod=allowed
#    Expected: Pod creation succeeds
#
# 3. Try creating the disallowed pod:
#    kubectl apply -f psa-test-pods.yaml -l pod=disallowed
#    Expected: Warning in audit mode, will be blocked in enforce mode
#
# 4. Check pod status:
#    kubectl get pods -n staging
#    kubectl describe pod allowed-pod -n staging
#    kubectl describe pod disallowed-pod -n staging
#
# 5. Check audit logs for violations:
#    kubectl get events -n staging