apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

---
# Allow common inbound ports from other pods in the same namespace.
# This keeps the default-deny behavior for external sources but permits
# typical service-to-service traffic inside the namespace on common ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-common-ingress
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector: {} # allow from any pod in same namespace
      ports:
        - protocol: TCP
          port: 80    # HTTP
        - protocol: TCP
          port: 443   # HTTPS
        - protocol: TCP
          port: 8080  # common app/health
        - protocol: TCP
          port: 3000  # app port (nodejs)
        - protocol: TCP
          port: 9090  # prometheus/metrics
        - protocol: TCP
          port: 5000  # app port
        - protocol: TCP
          port: 22    # ssh (if used)
        - protocol: TCP
          port: 3306  # mysql
        - protocol: TCP
          port: 5432  # postgres

---
# Allow essential egress: DNS (kube-dns), HTTPS (registry/API), and NTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-essential-egress
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow DNS to kube-dns in kube-system (adjust selectors as needed)
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow HTTPS to internet (registry, APIs)
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

    # Allow NTP (UDP 123)
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 123

# Apply with:
# kubectl apply -f manifests/network-policy-example.yaml
# After applying default-deny, add targeted allow rules (this file adds
# intra-namespace common-port ingress and essential egress for DNS/HTTPS/NTP).
