# Example Pod Security Admission (PSA) policy guidance - not applied by Terraform.
# Apply these manifests with kubectl after cluster is ready.

# Recommended: enforce 'restricted' baseline in sensitive namespaces.
apiVersion: policy/v1
kind: PodSecurityPolicy
metadata:
  name: restricted-psp
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535

# NOTE: PodSecurityPolicy is deprecated on newer k8s versions; prefer PodSecurity Admission (PSA) and implement via namespace labels.
# Example namespace label for PSA enforcement:
# kubectl label ns production pod-security.kubernetes.io/enforce=restricted
